name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # DEPL-03 "lint" — post-research decision (CONTEXT 2026-09-08)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6  # CI-only, pinned per checkpoint decision (Task 2); NOT into requirements.txt (NFR-02 + slim image)
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                # see both legs' results even if one fails
      matrix:
        python-version: ["3.12", "3.14"]   # both stable in setup-python manifest [VERIFIED]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                  # hashes requirements.txt by default [CITED: setup-python README]
      - run: pip install -r requirements.txt
      - run: python -m pytest -q     # -m form puts repo root on sys.path (bare `pytest` does not); exit 0 pass / 1 fail / 2 collection error [VERIFIED: local exit-code probes]

  docker-build:
    runs-on: ubuntu-latest            # Docker preinstalled on ubuntu images [CITED: runner-images README]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t llm-gateway:ci .
