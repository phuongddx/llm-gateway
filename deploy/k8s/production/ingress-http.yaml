apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: llm-gateway-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: llm-gateway.dropitx.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-gateway
                port:
                  number: 8000
