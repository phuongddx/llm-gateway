apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway-https
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - llm-gateway.dropitx.site
      secretName: dropitx-origin-tls
  rules:
    - host: llm-gateway.dropitx.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-gateway
                port:
                  number: 8000
